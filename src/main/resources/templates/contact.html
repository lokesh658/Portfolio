<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lokesh Sharma | Portfolio</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- TOP NAVBAR -->
<header class="topbar">
  <div class="logo">Lokesh</div>

  <nav class="top-links">
    <a href="/">Home</a>
    <a href="https://www.linkedin.com/in/lokeshsharma001/" target="_blank">LinkedIn ↗</a>
    <a href="https://drive.google.com/file/d/1Xwy5ZhOtNvCBrSjqzn0ExOdr-AaxmbEJ/view?usp=sharing" target="_blank">Resume ↗</a>
  </nav>
</header>

<!-- MAIN LAYOUT -->
<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h4>Sections</h4>
    <ul>
      <li><a href="/">Introduction</a></li>
      <li><a href="/about">About Me</a></li>
      <li><a href="/projects">Projects</a></li>
      <li><a href="/skills">Skills & Tools</a></li>
      <li><a href="/experience">Experience</a></li>
      <li><a href="/education">Education</a></li>
      <li class="active"><a href="/contact">Contact</a></li>
    </ul>
  </aside>

  <!-- HERO SECTION -->
  <section class="contact-section" id="contact">
    <div class="contact-container">

      <h2 class="contact-title">Contact</h2>
      <p class="contact-subtitle">
        Get in touch before I write another line of code!
      </p>

      <form class="contact-form">

        <div class="form-group">
          <label for="name">Name<span>*</span></label>
          <input
                  type="text"
                  id="name"
                  placeholder="Your name, your fame"
                  required
          />
        </div>

        <div class="form-group">
          <label for="email">Email<span>*</span></label>
          <input
                  type="email"
                  id="email"
                  placeholder="Where can I reach you back?"
                  required
          />
          <small>
            Temporary emails are also accepted, unless you wish to hear back 😉
          </small>
        </div>

        <div class="form-group">
          <label for="message">Message<span>*</span></label>
          <textarea
                  id="message"
                  rows="5"
                  placeholder="Your words, my inbox."
                  required
          ></textarea>
        </div>

        <button type="submit" class="btn-primary">Submit</button>
        <button type="reset" class="btn-secondary">Reset</button>

      </form>

      <div class="contact-nav">
        <a href="/education">← Education</a>
      </div>

    </div>
  </section>


</div>

</body>
</html>
